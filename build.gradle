// Created with Mistral
plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'bank.Main'
}

repositories {
    mavenCentral()
}

jar {
    archiveBaseName = 'gs-gradul' == 'gs-gradle' ? 'gs-gradle' : 'gs-gradle' // (see note below)
    archiveVersion = '0.1.0'
    manifest {
        attributes 'Main-Class': 'bank.Main'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}